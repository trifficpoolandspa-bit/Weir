<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --teal:#134E4A; --teal-soft:#E4F0EE; --rust:#B8492E; --ink:#1F2D2B; --muted:#5E7371; }
  *{box-sizing:border-box;}
  /* Nothing to type or select here: no blinking text cursor on a click */
  html,body,*{caret-color:transparent;user-select:none;-webkit-user-select:none;cursor:default;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
       font-family:"DM Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
       background:linear-gradient(160deg,#EAF3F1 0%,#F6F8F7 55%,#FFFFFF 100%);}
  .card{width:100%;max-width:460px;background:#fff;border-radius:20px;padding:40px 32px 34px;text-align:center;
        box-shadow:0 18px 50px rgba(19,78,74,.12);border:1px solid #E3ECEA;}
  .badge{width:76px;height:76px;margin:0 auto 22px;border-radius:50%;display:flex;align-items:center;justify-content:center;
         background:var(--teal-soft);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;}
  .badge svg{width:38px;height:38px;}
  .badge path{stroke:var(--teal);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;
              stroke-dasharray:48;stroke-dashoffset:48;animation:draw .5s .35s ease forwards;}
  h1{font-size:25px;margin:0 0 10px;letter-spacing:-.01em;}
  p{font-size:16px;line-height:1.55;color:var(--muted);margin:0;}
  .answer{display:inline-block;margin:18px 0 0;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
          background:var(--teal-soft);color:var(--teal);}
  .answer.denied{background:#FBEAE4;color:var(--rust);}
  .foot{margin-top:26px;font-size:13px;color:#8A9A98;}
  .close-link{display:inline-block;margin-top:8px;padding:0;border:0;background:none;font:inherit;font-size:14px;font-weight:700;
              color:var(--teal);text-decoration:underline;text-underline-offset:3px;cursor:pointer !important;}
  .close-link:hover{color:#0B3734;}
  .dl-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin-top:20px;padding:13px 22px;border-radius:12px;border:0;
          background:var(--teal);color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer !important;}
  .dl-btn svg{width:18px;height:18px;}
  /* Send a message (Oct 22): the one place here with something to type */
  .msg-box{width:100%;min-height:120px;margin-top:18px;padding:12px 13px;border-radius:12px;border:1.5px solid #CFE0DD;
           font:inherit;font-size:15px;line-height:1.45;color:var(--ink);resize:vertical;outline:none;
           caret-color:auto !important;user-select:text !important;-webkit-user-select:text !important;cursor:text !important;}
  .msg-box:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(19,78,74,.12);}
  .msg-send{width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--teal);color:#fff;
            font:inherit;font-size:15px;font-weight:700;cursor:pointer !important;}
  .msg-send:disabled{opacity:.6;}
  .msg-need{display:none;margin-top:8px;font-size:13px;font-weight:700;color:var(--rust);text-align:left;}
  /* The quote, in the email's own look, after Approve / Decline (Nov 1) */
  .card.qv{max-width:520px;padding:0;text-align:left;overflow:hidden;}
  .qv-band{padding:20px 24px;color:#fff;font-size:18px;font-weight:700;}
  .qv-saved{display:flex;align-items:center;gap:8px;padding:11px 24px;font-size:14px;font-weight:700;background:#E3F2E8;color:#2E6B47;}
  .qv-saved.no{background:#FBEAE4;color:var(--rust);}
  .qv-saved.err{background:#FBF4E4;color:#8A6410;}
  .qv-top{padding:20px 24px 0;}
  .qv-kind{font-size:12px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;}
  .qv-kind b{font-size:21px;color:#0E4A4D;text-transform:none;letter-spacing:-.01em;margin-left:8px;vertical-align:middle;}
  .qv-kind b i{font-style:normal;color:#A9BCB9;font-weight:500;}
  .qv-who{font-size:17px;font-weight:700;color:#16302E;margin-top:6px;}
  .qv-sub{font-size:13.5px;color:#6B7B79;margin-top:2px;}
  .qv-items{padding:16px 24px 0;}
  .qv-hd{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:#0F766E;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid #E6E9E8;padding:6px 0;}
  .qv-line{display:flex;gap:12px;border-bottom:1px solid #E6E9E8;padding:11px 0;font-size:15px;color:#16302E;}
  .qv-line .n{flex:1;min-width:0;}
  .qv-line .q{color:#6B7B79;font-size:13px;}
  .qv-line .a{font-weight:700;white-space:nowrap;}
  .qv-tot{display:flex;justify-content:space-between;padding:12px 0 0;font-size:15px;font-weight:700;color:#16302E;}
  .qv-tot .v{font-size:18px;}
  .qv-notes{padding:16px 24px 0;font-size:14px;color:#4A5A58;white-space:pre-wrap;line-height:1.5;}
  .qv-notes b{display:block;font-size:12px;color:#0F766E;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;}
  .qv-foot{padding:18px 24px 24px;}
  .qv-stamp{text-align:center;margin:0 0 14px;}
  .qv-stamp span{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:700;animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;}
  .qv-btns{display:flex;gap:10px;}
  .qv-btn{flex:1;padding:14px 8px;border:0;border-radius:11px;color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer !important;transition:opacity .2s,box-shadow .2s,transform .12s;}
  .qv-btn:active{transform:scale(.97);}
  .qv-btn.dim{opacity:.4;}
  .qv-btn.on{box-shadow:0 0 0 3px rgba(0,0,0,.12);}
  .qv-btn:disabled{cursor:default !important;}
  .qv-note{margin-top:12px;font-size:13px;color:#6B7B79;text-align:center;}
  .qv-company{margin-top:18px;text-align:center;font-size:13px;color:#8A9A98;}
  .wait .badge path{display:none;}
  .wait .badge{animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
<!-- Where a customer lands from the Approve / Deny buttons in a quote email:
     the answer is sent straight away and they're thanked. -->
<div class="card wait" id="card">
  <div class="badge"><svg viewBox="0 0 38 38"><path d="M9 20 L16 27 L29 12"/></svg></div>
  <h1 id="title">One moment…</h1>
  <p id="text">Sending your answer.</p>
  <div id="answer" class="answer" style="display:none;"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
// The public keys, the same ones the website uses (safe to show; the server's
// rules decide what they can read)
const QR_KEYS = {
  'myxxahrlmzvrbcmopwyo.supabase.co': 'sb_publishable_32m_kcK3pQpClCGAvAAogg_Ut9RBFS1',
  'mjjgvpejbibybhsmrdno.supabase.co': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qamd2cGVqYmlieWJoc21yZG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTIyNzgsImV4cCI6MjEwNTY2ODI3OH0.fC627DhuydW81Bie_abdlWTZ-FykNHZUMVd9RrFJSJg'
  };
(function(){
  const q = new URLSearchParams(location.search);
  const token = q.get('t') || '';
  // Download quote (Oct 15): the quote as a PDF, not an answer
  if(q.get('a') === 'download'){ downloadQuote(q.get('s') || '', token); return; }
  // Send a message (Oct 22): a box to write in, nothing answered
  if(q.get('a') === 'message'){ messageQuote(q.get('s') || '', token); return; }
  const action = q.get('a') === 'deny' ? 'deny' : 'approve';
  const server = q.get('s') || '';
  const card = document.getElementById('card');
  const $ = id => document.getElementById(id);
  const done = (title, text, outcome, company)=>{
    card.classList.remove('wait');
    $('title').textContent = title;
    $('text').textContent = text;
    if(outcome){
      const a = $('answer');
      a.textContent = outcome === 'denied' ? 'Quote declined' : 'Quote approved';
      a.className = 'answer' + (outcome === 'denied' ? ' denied' : '');
      a.style.display = 'inline-block';
    }
    // The company, then "Close this page", which closes it where the browser allows
    const foot = $('foot');
    foot.textContent = company || '';
    const shut = document.createElement('button');
    shut.type = 'button';
    shut.className = 'close-link';
    shut.textContent = 'Close this page';
    shut.addEventListener('click', ()=>{
      window.close();
      // Some browsers don't let a page close its own tab: say so instead of doing nothing
      setTimeout(()=>{ if(!window.closed){ shut.textContent = 'You can close this tab now'; shut.style.textDecoration = 'none'; shut.style.cursor = 'default'; } }, 300);
    });
    if(company) foot.appendChild(document.createElement('br'));
    foot.appendChild(shut);
  };
  // Only ever a Supabase address
  let fn = '';
  try{
    const u = new URL(server);
    if(u.protocol === 'https:' && /\.supabase\.co$/.test(u.hostname)) fn = u.origin + '/functions/v1/quote-response';
  }catch(e){}
  if(!token || !fn){ done('Thank you for your response!', 'We will be in touch shortly.'); return; }

  const send = tries => fetch(fn, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({t: token, a: action})})
    .then(r => r.json())
    .then(res=>{
      if(res.state === 'recorded'){
        // The quote itself, in the email's look, with the answer filled in
        // (Nov 1); the plain thank-you if its breakdown can't be had
        const thanks = ()=> done('Thank you for your response!',
             (res.company ? res.company + ' has' : 'We have') + ' your answer and will be in touch soon.',
             res.outcome, res.company);
        showQuote(server, token, fn, res.outcome, res.company).then(ok => { if(!ok) thanks(); }).catch(thanks);
      } else if(res.state === 'expired'){
        done('This quote has expired',
             'It was sent more than ' + (res.days || 30) + ' days ago. Please contact ' + (res.company || 'us') + ' for an updated quote.',
             null, res.company);
        card.querySelector('.badge').style.display = 'none';
      } else if(res.state === 'error'){
        done('Almost there', 'We couldn\u2019t record your answer just now. Please try again shortly, or reply to the email.', null, res.company);
        try{ console.warn('quote-response:', res.why); }catch(e){}
      } else {
        done('Thank you!', 'We couldn\u2019t match this link to a quote. Please reply to the email or give us a call and we\u2019ll sort it out.', null, res.company);
      }
    })
    .catch(()=>{
      if(tries > 0) return setTimeout(()=> send(tries - 1), 1500);
      done('Almost there', 'We couldn\u2019t reach our system just now. Please check your connection and reload this page.');
    });
  send(2);
})();



// ---------- The quote, answered (Nov 1) ----------
// After Approve or Decline in the email: the quote laid out as the
// email has it (the company's colour, the number, the items and total), the
// answer saved and shown in green or red, and both buttons here to change it
// until the quote expires. The breakdown comes from the quote's code (snippet
// 34), the same way Download quote gets it.
function showQuote(server, token, fn, outcome, company){
  let host = '', key = '';
  try{
    const u = new URL(server);
    if(u.protocol === 'https:' && /\.supabase\.co$/.test(u.hostname)){ host = u.origin; key = QR_KEYS[u.hostname] || ''; }
  }catch(e){}
  if(!host || !key) return Promise.resolve(false);
  return fetch(host + '/rest/v1/rpc/quote_download', {
    method: 'POST',
    headers: {'content-type': 'application/json', apikey: key, Authorization: 'Bearer ' + key},
    body: JSON.stringify({p_token: token})
  }).then(r => r.ok ? r.json() : null).then(d=>{
    if(!d || typeof d !== 'object' || !Array.isArray(d.items) || !d.items.length) return false;
    drawQuote(d, token, fn, outcome, company || (d.company && d.company.name) || d.companyName || '');
    return true;
  });
}
function drawQuote(d, token, fn, outcome, company){
  const card = document.getElementById('card');
  const el = (tag, cls, text)=>{ const x = document.createElement(tag); if(cls) x.className = cls; if(text !== undefined) x.textContent = text; return x; };
  const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const colour = /^#[0-9a-f]{6}$/i.test(String(d.colour || '')) ? d.colour : '#134E4A';
  document.title = (d.type || 'Quote') + (d.number ? ' #' + d.number : '');
  card.className = 'card qv';
  card.innerHTML = '';
  card.appendChild(el('div', 'qv-band', company || 'Your quote')).style.background = colour;
  const saved = el('div', 'qv-saved');
  card.appendChild(saved);
  const top = el('div', 'qv-top');
  const kind = el('div', 'qv-kind', d.type || 'Quote');
  if(d.number){ const b = el('b'); b.appendChild(el('i', '', '#')); b.appendChild(document.createTextNode(d.number)); kind.appendChild(b); }
  top.appendChild(kind);
  if(d.customer && d.customer.name) top.appendChild(el('div', 'qv-who', d.customer.name));
  if(d.customer && d.customer.address) top.appendChild(el('div', 'qv-sub', d.customer.address));
  if(d.date) top.appendChild(el('div', 'qv-sub', d.date));
  card.appendChild(top);
  const items = el('div', 'qv-items');
  const hd = el('div', 'qv-hd'); hd.appendChild(el('span', '', 'Item')); hd.appendChild(el('span', '', 'Amount'));
  items.appendChild(hd);
  d.items.forEach(it=>{
    const qty = Number(it.qty) || 0, price = Number(it.price) || 0;
    const row = el('div', 'qv-line');
    const n = el('span', 'n', it.description || 'Item');
    if(qty !== 1) n.appendChild(el('span', 'q', '  \u00d7 ' + qty));
    // The item's description (Nov 1)
    if(it.detail){ const dd = el('div', '', String(it.detail)); dd.style.cssText = 'font-size:13px;color:#6B7B79;margin-top:3px;line-height:1.4;white-space:pre-wrap;'; n.appendChild(dd); }
    row.appendChild(n);
    row.appendChild(el('span', 'a', money(qty * price)));
    items.appendChild(row);
  });
  const tot = el('div', 'qv-tot'); tot.appendChild(el('span', '', 'Total')); tot.appendChild(el('span', 'v', money(d.total)));
  items.appendChild(tot);
  card.appendChild(items);
  if(String(d.notes || '').trim()){
    const nt = el('div', 'qv-notes'); nt.appendChild(el('b', '', 'Notes')); nt.appendChild(document.createTextNode(String(d.notes).trim()));
    card.appendChild(nt);
  }
  const foot = el('div', 'qv-foot');
  const stamp = el('div', 'qv-stamp');
  const btns = el('div', 'qv-btns');
  const yes = el('button', 'qv-btn', 'Approve'); yes.type = 'button'; yes.style.background = colour;
  const no = el('button', 'qv-btn', 'Decline'); no.type = 'button'; no.style.background = '#B8492E';
  btns.appendChild(yes); btns.appendChild(no);
  const note = el('div', 'qv-note', d.expiresOn ? 'You can change your answer until ' + d.expiresOn + '.' : 'You can change your answer any time before the quote expires.');
  foot.appendChild(stamp); foot.appendChild(btns); foot.appendChild(note);
  foot.appendChild(el('div', 'qv-company', company));
  card.appendChild(foot);
  const tick = '<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const paint = o=>{
    const ok = o !== 'denied';
    saved.className = 'qv-saved' + (ok ? '' : ' no');
    saved.innerHTML = tick;
    saved.appendChild(document.createTextNode('Saved \u2014 quote ' + (ok ? 'approved' : 'declined') + '. Thank you!'));
    stamp.innerHTML = '';
    const pill = el('span', '', ok ? '\u2713 Approved' : '\u2715 Declined');
    pill.style.cssText = ok ? 'background:#E3F2E8;color:#2E6B47;' : 'background:#FBEAE4;color:#B8492E;';
    stamp.appendChild(pill);
    yes.className = 'qv-btn' + (ok ? ' on' : ' dim');
    no.className = 'qv-btn' + (ok ? ' dim' : ' on');
  };
  const say = (text)=>{ saved.className = 'qv-saved err'; saved.textContent = text; };
  let current = outcome === 'denied' ? 'denied' : 'approved';
  paint(current);
  const pick = a=>{
    const want = a === 'deny' ? 'denied' : 'approved';
    if(want === current) return;
    yes.disabled = no.disabled = true;
    fetch(fn, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({t: token, a: a})})
      .then(r => r.json())
      .then(r2=>{
        if(r2.state === 'recorded'){ current = r2.outcome === 'denied' ? 'denied' : 'approved'; paint(current); }
        else if(r2.state === 'expired') say('This quote has expired, so the answer can no longer be changed.');
        else say('We couldn\u2019t save that just now. Please try again.');
      })
      .catch(()=> say('We couldn\u2019t reach our system. Check your connection and try again.'))
      .then(()=>{ yes.disabled = no.disabled = false; });
  };
  yes.addEventListener('click', ()=> pick('approve'));
  no.addEventListener('click', ()=> pick('deny'));
}

// ---------- Send a message (Oct 22) ----------
// The email's Send a message button lands here: a box for the customer's
// question, sent to the company with the quote. Approving or declining is
// still done with the email's own buttons.
function messageQuote(server, token){
  const card = document.getElementById('card');
  const $ = id => document.getElementById(id);
  document.title = 'Send a message';
  let fn = '';
  try{
    const u = new URL(server);
    if(u.protocol === 'https:' && /\.supabase\.co$/.test(u.hostname)) fn = u.origin + '/functions/v1/quote-response';
  }catch(e){}
  card.classList.remove('wait');
  card.querySelector('.badge').style.display = 'none';
  $('title').textContent = 'Send a message';
  $('text').textContent = 'Ask a question or let us know anything about this quote.';
  if(!token || !fn){
    $('text').textContent = 'We couldn\u2019t match this link to a quote. Please reply to the email or give us a call.';
    return;
  }
  const box = document.createElement('textarea');
  box.className = 'msg-box';
  box.placeholder = 'Type your message';
  box.maxLength = 2000;
  const need = document.createElement('div');
  need.className = 'msg-need';
  need.textContent = 'Write a message first.';
  const send = document.createElement('button');
  send.type = 'button';
  send.className = 'msg-send';
  send.textContent = 'Send';
  const foot = $('foot');
  card.insertBefore(box, foot);
  card.insertBefore(need, foot);
  card.insertBefore(send, foot);
  const post = body => fetch(fn, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(body)}).then(r => r.json());
  // Who it goes to, and which quote
  post({t: token, a: 'message'}).then(res=>{
    if(res.company) foot.textContent = res.company;
    if(res.state === 'missing'){
      $('text').textContent = 'We couldn\u2019t match this link to a quote. Please reply to the email or give us a call.';
      box.remove(); send.remove();
      return;
    }
    $('text').textContent = 'About ' + (res.number ? 'quote #' + res.number : 'your quote')
      + (res.company ? ' from ' + res.company : '') + '.';
  }).catch(()=>{});
  box.addEventListener('input', ()=>{ need.style.display = 'none'; box.style.borderColor = ''; });
  send.addEventListener('click', ()=>{
    const m = box.value.trim();
    if(!m){ need.style.display = 'block'; box.style.borderColor = 'var(--rust)'; box.focus(); return; }
    send.disabled = true;
    send.textContent = 'Sending\u2026';
    post({t: token, a: 'message', m: m}).then(res=>{
      if(res.state === 'sent'){
        box.remove(); need.remove(); send.remove();
        const badge = card.querySelector('.badge');
        badge.style.display = '';
        $('title').textContent = 'Message sent';
        $('text').textContent = (res.company || 'We') + (res.company ? ' has' : ' have') + ' your message and will get back to you.';
        const again = document.createElement('button');
        again.type = 'button';
        again.className = 'close-link';
        again.textContent = 'Send another message';
        again.addEventListener('click', ()=> location.reload());
        card.insertBefore(again, foot);
      } else {
        send.disabled = false;
        send.textContent = 'Send';
        need.textContent = res.state === 'full'
          ? 'This quote has too many messages. Please reply to the email instead.'
          : 'We couldn\u2019t send that just now. Please try again in a moment.';
        need.style.display = 'block';
      }
    }).catch(()=>{
      send.disabled = false;
      send.textContent = 'Send';
      need.textContent = 'We couldn\u2019t reach our system. Check your connection and try again.';
      need.style.display = 'block';
    });
  });
}

// ---------- Download quote (Oct 15) ----------
// The email's Download button lands here. The quote's breakdown, kept on the
// server with its code (snippet 34), is drawn as a PDF and saved to the
// customer's phone or computer. Nothing is recorded.
function downloadQuote(server, token){
  const card = document.getElementById('card');
  const $ = id => document.getElementById(id);
  // The public keys, the same ones the website uses (safe to show; the server's
  // rules decide what they can read)
  const KEYS = QR_KEYS;
  document.title = 'Your quote';
  $('title').textContent = 'One moment…';
  $('text').textContent = 'Getting your quote ready.';
  const say = (title, text)=>{
    card.classList.remove('wait');
    card.querySelector('.badge').style.display = 'none';
    $('title').textContent = title;
    $('text').textContent = text;
  };
  let host = '', key = '';
  try{
    const u = new URL(server);
    if(u.protocol === 'https:' && /\.supabase\.co$/.test(u.hostname)){ host = u.origin; key = KEYS[u.hostname] || ''; }
  }catch(e){}
  if(!token || !host || !key){ say('Thank you!', 'We will be in touch shortly.'); return; }

  const lib = new Promise((ok, fail)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    sc.onload = ()=> ok(); sc.onerror = ()=> fail(new Error('pdf'));
    document.head.appendChild(sc);
  });
  const ask = tries => fetch(host + '/rest/v1/rpc/quote_download', {
      method: 'POST',
      headers: {'content-type': 'application/json', apikey: key, Authorization: 'Bearer ' + key},
      body: JSON.stringify({p_token: token})
    }).then(r => r.ok ? r.json() : null)
    .catch(()=> tries > 0 ? new Promise(r => setTimeout(r, 1500)).then(()=> ask(tries - 1)) : 'offline');

  Promise.all([ask(2), lib.catch(()=> null)]).then(([d])=>{
    if(d === 'offline'){ say('Almost there', 'We couldn’t reach our system just now. Please check your connection and reload this page.'); return; }
    if(!d || typeof d !== 'object' || !Array.isArray(d.items)){
      say('This quote can’t be downloaded', 'Please reply to the email and we’ll send it to you another way.'); return;
    }
    if(!window.jspdf){ say('Almost there', 'Your quote couldn’t be prepared just now. Please reload this page to try again.'); return; }
    let doc, name;
    try{ ({doc, name} = drawQuotePdf(d)); }
    catch(e){ say('Almost there', 'Your quote couldn’t be prepared just now. Please reload this page to try again.'); return; }
    const company = d.company && d.company.name || d.companyName || '';
    const kind = String(d.type || 'Quote').toLowerCase();
    card.classList.remove('wait');
    $('title').textContent = 'Your ' + kind + ' is downloading';
    $('text').textContent = 'Look for “' + name + '” in your downloads. If it didn’t start, press the button below.';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'dl-btn';
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>';
    btn.appendChild(document.createTextNode('Download ' + kind));
    btn.addEventListener('click', ()=> doc.save(name));
    $('text').after(btn);
    $('foot').textContent = company;
    try{ doc.save(name); }catch(e){}
  });
}

// One Letter page (more for a long quote): the company band, who it's for and
// when, the items, the total, the notes, and a footer on every page
function drawQuotePdf(d){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit: 'pt', format: 'letter'});
  const W = 612, H = 792, L = 40, R = 572;
  const rgb = hex=>{
    const m = String(hex || '').replace('#', '').match(/^([0-9a-f]{6})$/i);
    const h = m ? m[1] : '134E4A';
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  const brand = rgb(d.colour), teal = [15, 118, 110], ink = [22, 48, 46], soft = [74, 90, 88], muted = [107, 123, 121], line = [230, 233, 232];
  const money = n => '$' + (Number(n) || 0).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
  const co = d.company || {};
  const company = co.name || d.companyName || '';
  const type = d.type || 'Quote';
  const num = d.number ? String(d.number) : '';
  const set = (size, style, colour)=>{ doc.setFont('helvetica', style || 'normal'); doc.setFontSize(size); doc.setTextColor.apply(doc, colour || ink); };

  // The band across the top of the first page
  doc.setFillColor.apply(doc, brand); doc.rect(0, 0, W, 118, 'F');
  set(20, 'bold', [255, 255, 255]); doc.text(company || type, L, 50, {maxWidth: 360});
  set(9.5, 'normal', [225, 238, 236]);
  const c1 = [co.phone, co.email].filter(Boolean).join('   ·   ');
  const c2 = [co.website, co.license ? 'License ' + co.license : ''].filter(Boolean).join('   ·   ');
  if(c1) doc.text(c1, L, 72);
  if(c2) doc.text(c2, L, c1 ? 87 : 72);
  set(9, 'bold', [225, 238, 236]); doc.text(type.toUpperCase(), R, 48, {align: 'right', charSpace: 1.5});
  if(num){
    set(28, 'bold', [255, 255, 255]); doc.text(num, R, 82, {align: 'right'});
    const w = doc.getTextWidth(num);
    set(28, 'normal', [160, 196, 191]); doc.text('#', R - w - 2, 82, {align: 'right'});
  }

  // Prepared for, the date, and the quote's name
  let y = 152;
  const label = (t, x, yy)=>{ set(8, 'bold', teal); doc.text(t.toUpperCase(), x, yy, {charSpace: 0.8}); };
  label('Prepared for', L, y);
  set(12.5, 'bold', ink); doc.text(d.customer && d.customer.name || '', L, y + 17, {maxWidth: 220});
  let yA = y + 17;
  if(d.customer && d.customer.address){
    set(10, 'normal', muted);
    const addr = doc.splitTextToSize(d.customer.address, 215);
    doc.text(addr, L, y + 32); yA = y + 32 + (addr.length - 1) * 12;
  }
  label('Date', 290, y); set(10.5, 'normal', ink); doc.text(d.date || '', 290, y + 17);
  let yB = y + 17;
  if(d.expiresOn){ label('Valid until', 290, y + 38); set(10.5, 'normal', ink); doc.text(d.expiresOn, 290, y + 55); yB = y + 55; }
  let yC = y;
  if(d.name){
    label(type, 440, y); set(10.5, 'normal', ink);
    const nm = doc.splitTextToSize(d.name, 132); doc.text(nm, 440, y + 17); yC = y + 17 + (nm.length - 1) * 13;
  }
  y = Math.max(yA, yB, yC) + 22;
  doc.setDrawColor.apply(doc, line); doc.setLineWidth(1); doc.line(L, y, R, y);

  // The items
  const cols = {qty: 384, price: 476, amount: R - 10};
  const header = yy=>{
    set(8, 'bold', teal);
    doc.text('ITEM', L + 10, yy, {charSpace: 0.8});
    doc.text('QTY', cols.qty, yy, {align: 'center', charSpace: 0.8});
    doc.text('PRICE', cols.price, yy, {align: 'right', charSpace: 0.8});
    doc.text('AMOUNT', cols.amount, yy, {align: 'right', charSpace: 0.8});
    doc.setDrawColor.apply(doc, brand); doc.setLineWidth(1.5); doc.line(L, yy + 8, R, yy + 8);
    return yy + 8;
  };
  const BOTTOM = H - 78;
  const nextPage = ()=>{
    doc.addPage();
    set(10, 'bold', ink); doc.text(company, L, 46);
    set(10, 'normal', muted); doc.text(type + (num ? ' #' + num : '') + ' (continued)', R, 46, {align: 'right'});
    return header(84);
  };
  y = header(y + 30);
  d.items.forEach((it, i)=>{
    set(10.5, 'bold', ink);
    const desc = doc.splitTextToSize(String(it.description || ''), 300);
    // The item's description under its name (Nov 1)
    set(9.5, 'normal', muted);
    const det = it.detail ? doc.splitTextToSize(String(it.detail), 300) : [];
    const h = 14 + desc.length * 13 + (det.length ? 4 + det.length * 11.5 : 0);
    if(y + h > BOTTOM) y = nextPage();
    if(i % 2 === 1){ doc.setFillColor(247, 250, 249); doc.rect(L, y, R - L, h, 'F'); }
    set(10.5, 'bold', ink); doc.text(desc, L + 10, y + 17);
    if(det.length){ set(9.5, 'normal', muted); doc.text(det, L + 10, y + 17 + desc.length * 13 + 2); }
    set(10.5, 'normal', soft);
    const qty = Number(it.qty) || 0, price = Number(it.price) || 0;
    doc.text(String(qty), cols.qty, y + 17, {align: 'center'});
    doc.text(money(price), cols.price, y + 17, {align: 'right'});
    set(10.5, 'bold', ink); doc.text(money(qty * price), cols.amount, y + 17, {align: 'right'});
    doc.setDrawColor.apply(doc, line); doc.setLineWidth(0.8); doc.line(L, y + h, R, y + h);
    y += h;
  });

  // The total, in a solid bar on the right
  if(y + 80 > BOTTOM) y = nextPage();
  y += 18;
  y += 14;
  doc.setFillColor.apply(doc, brand); doc.roundedRect(R - 240, y, 240, 42, 7, 7, 'F');
  set(9, 'bold', [225, 238, 236]); doc.text('TOTAL', R - 226, y + 25, {charSpace: 1.2});
  set(19, 'bold', [255, 255, 255]); doc.text(money(d.total), R - 14, y + 28, {align: 'right'});
  y += 42;

  // Notes
  if(String(d.notes || '').trim()){
    set(10.5, 'normal', soft);
    const lines = doc.splitTextToSize(String(d.notes).trim(), R - L - 40);
    const h = 36 + lines.length * 14;
    y += 28;
    if(y + h > BOTTOM) y = nextPage() + 20;
    doc.setFillColor(244, 248, 247); doc.rect(L, y, R - L, h, 'F');
    doc.setFillColor.apply(doc, teal); doc.rect(L, y, 3, h, 'F');
    label('Notes', L + 18, y + 18);
    set(10.5, 'normal', soft); doc.text(lines, L + 18, y + 36);
    y += h;
  }

  // How to answer (quotes only)
  if(type === 'Quote'){
    y += 24;
    if(y + 20 > BOTTOM) y = nextPage() + 20;
    set(10, 'normal', soft);
    doc.text('To approve, press Approve in the email, or reply to it. Questions? Call or email us any time.', L, y);
  }

  // A footer on every page
  const pages = doc.getNumberOfPages();
  for(let p = 1; p <= pages; p++){
    doc.setPage(p);
    doc.setDrawColor.apply(doc, line); doc.setLineWidth(1); doc.line(L, H - 58, R, H - 58);
    set(10, 'bold', ink); doc.text(company, L, H - 38);
    if(d.signoff){ set(9, 'normal', muted); doc.text(String(d.signoff).split('\n')[0], L, H - 24, {maxWidth: 330}); }
    set(9, 'normal', muted);
    doc.text(type + (num ? ' #' + num : '') + '   ·   Page ' + p + ' of ' + pages, R, H - 38, {align: 'right'});
  }

  const safe = t => String(t || '').replace(/[\\/:*?"<>|]+/g, '').trim();
  const name = safe(type + (num ? ' ' + num : '') + (company ? ' – ' + company : '')) + '.pdf';
  return {doc, name};
}
